<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>灵魂鉴定局 - 搞笑性格测试</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f0f1a;--bg2:#1a1a2e;--card:#16213e;--card2:#1a1a3e;
  --accent:#e94560;--accent2:#ff6b6b;--accent3:#feca57;
  --text:#eee;--text2:#aaa;--text3:#888;
  --radius:20px;--radius-sm:12px;
}
html{scroll-behavior:smooth}
body{
  font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);
  min-height:100dvh;overflow-x:hidden;
}
/* ===== LOADING ===== */
.loading-screen{
  position:fixed;inset:0;z-index:1000;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity .6s,visibility .6s;
}
.loading-screen.hidden{opacity:0;visibility:hidden;pointer-events:none}
.loading-orb{
  width:80px;height:80px;border-radius:50%;
  background:conic-gradient(var(--accent),var(--accent3),var(--accent));
  animation:spin 1s linear infinite;
  margin-bottom:24px;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:var(--text2);font-size:14px;letter-spacing:2px}

/* ===== PARTICLES BG ===== */
.particles{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.particle{
  position:absolute;border-radius:50%;opacity:.15;
  animation:float linear infinite;
}
@keyframes float{
  0%{transform:translateY(100vh) rotate(0deg)}
  100%{transform:translateY(-100px) rotate(720deg)}
}

/* ===== PAGES ===== */
.page{
  display:none;min-height:100dvh;position:relative;z-index:1;
}
.page.active{display:flex;flex-direction:column;align-items:center}

/* ===== START PAGE ===== */
.start-page{
  justify-content:center;padding:40px 20px;text-align:center;
}
.start-badge{
  display:inline-block;padding:6px 20px;border-radius:100px;
  background:rgba(233,69,96,.15);color:var(--accent);font-size:13px;
  font-weight:500;letter-spacing:1px;margin-bottom:24px;
  border:1px solid rgba(233,69,96,.3);
  margin-top: 32px;
}
.start-title{
  font-size:clamp(36px,8vw,72px);font-weight:900;line-height:1.1;
  background:linear-gradient(135deg,#fff 0%,var(--accent3) 50%,var(--accent) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  margin-bottom:16px;
}
.start-sub{
  font-size:clamp(16px,3vw,20px);color:var(--text2);max-width:500px;
  line-height:1.6;margin-bottom:48px;
}
.start-features{
  display:flex;gap:24px;flex-wrap:wrap;justify-content:center;margin-bottom:48px;
}
.feature{
  background:var(--card);border-radius:var(--radius-sm);padding:20px 24px;
  border:1px solid rgba(255,255,255,.06);text-align:center;min-width:140px;
}
.feature-num{font-size:32px;font-weight:900;color:var(--accent);display:block}
.feature-label{font-size:13px;color:var(--text2);margin-top:4px}
.start-categories{
  display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:40px;max-width:480px;
}
.cat-card{
  display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:100px;
  background:var(--card);border:1px solid rgba(255,255,255,.06);font-size:13px;
}
.cat-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.cat-name{color:var(--text);font-weight:500}
.cat-count{color:var(--text3);font-size:12px;margin-left:4px}
.btn-start{
  padding:18px 56px;border:none;border-radius:100px;cursor:pointer;
  font-size:18px;font-weight:700;color:#fff;font-family:inherit;
  background:linear-gradient(135deg,var(--accent),#ff8a5c);
  box-shadow:0 8px 32px rgba(233,69,96,.4);
  transition:transform .2s,box-shadow .2s;
  position:relative;overflow:hidden;
}
.btn-start:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(233,69,96,.5)}
.btn-start:active{transform:scale(.97)}
.btn-start::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);
  transform:translateX(-100%);
}
.btn-start:hover::after{animation:shimmer 1.5s infinite}
@keyframes shimmer{to{transform:translateX(100%)}}

/* ===== QUIZ PAGE ===== */
.quiz-page{padding:20px;padding-top:48px;padding-bottom:80px}
.quiz-header{
  max-width:640px;
  width: 100%;
  padding: 32px;
  margin-top: 32px;
  box-sizing: border-box;
}
.progress-wrap{
  display:flex;align-items:center;gap:12px;margin-bottom:12px;
}
.progress-num{font-size:14px;color:var(--text2);white-space:nowrap}
.progress-bar{
  flex:1;height:8px;background:var(--card);border-radius:100px;overflow:hidden;
}
.progress-fill{
  height:100%;border-radius:100px;
  background:linear-gradient(90deg,var(--accent),var(--accent3));
  transition:width .4s cubic-bezier(.16,1,.3,1);
  width:0%;
}
.quiz-counter{
  font-size:13px;color:var(--text3);text-align:right;
}
.question-card{
  max-width:640px;
  background:var(--card);border-radius:var(--radius);
  padding:40px 32px;border:1px solid rgba(255,255,255,.06);
  animation:fadeSlideIn .5s ease;
  margin: 32px;
  width: calc(100% - 64px);
  box-sizing: border-box;
}
@keyframes fadeSlideIn{
  from{opacity:0;transform:translateY(30px)}
  to{opacity:1;transform:translateY(0)}
}
.question-text{
  font-size:clamp(18px,4vw,24px);font-weight:700;line-height:1.5;
  margin-bottom:32px;color:#fff;
}
.options{display:flex;flex-direction:column;gap:12px}
.option{
  padding:16px 20px;border-radius:var(--radius-sm);cursor:pointer;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
  font-size:16px;color:var(--text);transition:all .2s;
  display:flex;align-items:center;gap:14px;text-align:left;
  font-family:inherit;line-height:1.5;
}
.option:hover{
  background:rgba(233,69,96,.1);border-color:rgba(233,69,96,.3);
  transform:translateX(4px);
}
.option:active{transform:scale(.98)}
.option-key{
  flex-shrink:0;width:32px;height:32px;border-radius:8px;
  background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:14px;color:var(--text2);
}
.option:hover .option-key{background:var(--accent);color:#fff}

/* ===== ANALYZING PAGE ===== */
.analyzing-page{justify-content:center;padding:40px;text-align:center}
.analyzing-spinner{
  width:120px;height:120px;margin:0 auto 32px;position:relative;
}
.analyzing-ring{
  position:absolute;inset:0;border-radius:50%;
  border:3px solid transparent;
  animation:spin 1.2s linear infinite;
}
.analyzing-ring:nth-child(1){border-top-color:var(--accent)}
.analyzing-ring:nth-child(2){inset:10px;border-right-color:var(--accent3);animation-direction:reverse;animation-duration:1.5s}
.analyzing-ring:nth-child(3){inset:20px;border-bottom-color:var(--accent2);animation-duration:1.8s}
.analyzing-face{
  position:absolute;inset:30px;border-radius:50%;
  background:var(--card);display:flex;align-items:center;justify-content:center;
  font-size:36px;
}
.analyzing-text{
  font-size:20px;font-weight:700;margin-bottom:12px;
  animation:pulse 1.5s ease-in-out infinite;
}
.analyzing-sub{color:var(--text2);font-size:14px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

/* ===== RESULT PAGE ===== */
.result-page{padding:20px;padding-top:48px;padding-bottom:80px}
.result-card{
  width:100%;max-width:640px;
  background:var(--card);border-radius:var(--radius);
  overflow:hidden;border:1px solid rgba(255,255,255,.06);
  animation:fadeSlideIn .6s ease;
}
.result-image-wrap{
  width:100%;aspect-ratio:1/1;overflow:hidden;position:relative;
  background:linear-gradient(135deg,var(--bg2),var(--card));
}
.result-image-wrap img{
  width:100%;height:100%;object-fit:cover;
}
.result-image-wrap .placeholder-art{
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  font-size:120px;
}
.result-cat-badge{
  display:inline-block;padding:6px 16px;border-radius:100px;
  font-size:13px;font-weight:700;letter-spacing:1px;margin-bottom:16px;
}
.result-title{
  font-size:clamp(28px,6vw,40px);font-weight:900;line-height:1.2;
  margin-bottom:8px;
}
.result-subtitle{
  font-size:18px;color:var(--accent2);margin-bottom:24px;font-weight:500;
}
.result-desc{
  font-size:16px;line-height:1.8;color:var(--text2);margin-bottom:24px;
}
.result-tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
.result-tag{
  padding:6px 14px;border-radius:100px;font-size:13px;
  background:rgba(255,255,255,.06);color:var(--text2);
  border:1px solid rgba(255,255,255,.08);
}
.result-stats{
  display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:32px;
}
.stat-item{
  text-align:center;padding:16px 8px;border-radius:var(--radius-sm);
  background:rgba(255,255,255,.04);
}
.stat-value{font-size:24px;font-weight:900;color:var(--accent)}
.stat-label{font-size:12px;color:var(--text3);margin-top:4px}
.result-compat{
  padding:20px;border-radius:var(--radius-sm);margin-bottom:28px;
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);
}
.result-compat h4{font-size:15px;color:var(--accent3);margin-bottom:12px;font-weight:700}
.result-compat-list{display:flex;flex-direction:column;gap:8px}
.compat-item{
  display:flex;align-items:center;justify-content:space-between;
  font-size:14px;color:var(--text2);
}
.compat-bar{
  flex:1;height:6px;background:rgba(255,255,255,.06);border-radius:100px;
  margin:0 12px;overflow:hidden;
}
.compat-fill{height:100%;border-radius:100px;transition:width 1s ease}
.compat-pct{font-weight:700;min-width:36px;text-align:right}
.result-advice{
  padding:20px;border-radius:var(--radius-sm);
  background:linear-gradient(135deg,rgba(233,69,96,.1),rgba(254,202,87,.1));
  border:1px solid rgba(233,69,96,.15);margin-bottom:28px;
}
.result-advice h4{font-size:15px;color:var(--accent);margin-bottom:8px;font-weight:700}
.result-advice p{font-size:14px;line-height:1.7;color:var(--text2)}

.btn-share,.btn-retry{
  width:100%;padding:16px;border:none;border-radius:var(--radius-sm);
  cursor:pointer;font-size:16px;font-weight:700;font-family:inherit;
  transition:all .2s;
}
.btn-share{
  background:linear-gradient(135deg,var(--accent),#ff8a5c);color:#fff;
  margin-bottom:12px;
}
.btn-retry{
  background:rgba(255,255,255,.06);color:var(--text2);
  border:1px solid rgba(255,255,255,.1);
}
.btn-share:hover,.btn-retry:hover{transform:translateY(-1px)}

/* ===== SPONSOR MODAL ===== */
.sponsor-overlay{
  position:fixed;inset:0;z-index:999;
  background:rgba(0,0,0,.7);backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;
  padding:20px;
  animation:fadeIn .3s ease;
}
.sponsor-overlay.hidden{display:none}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{
  from{opacity:0;transform:scale(.85) translateY(20px)}
  to{opacity:1;transform:scale(1) translateY(0)}
}
.sponsor-modal{
  background:var(--card);border-radius:var(--radius);
  max-width:380px;width:100%;padding:32px 28px;text-align:center;
  border:1px solid rgba(255,255,255,.08);
  animation:popIn .4s cubic-bezier(.16,1,.3,1);
  position:relative;
}
.sponsor-close{
  position:absolute;top:12px;right:16px;
  background:none;border:none;color:var(--text3);font-size:22px;
  cursor:pointer;line-height:1;padding:4px;
  transition:color .2s;
}
.sponsor-close:hover{color:var(--text)}
.sponsor-icon{font-size:48px;margin-bottom:12px;display:block}
.sponsor-title{
  font-size:22px;font-weight:900;margin-bottom:8px;
  background:linear-gradient(135deg,var(--accent3),var(--accent));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.sponsor-desc{
  font-size:14px;color:var(--text2);line-height:1.7;margin-bottom:20px;
}
.sponsor-qr-wrap{
  display:inline-block;padding:12px;background:#fff;border-radius:16px;
  margin-bottom:16px;box-shadow:0 4px 24px rgba(0,0,0,.3);
}
.sponsor-qr-wrap img{
  width:200px;height:200px;display:block;border-radius:8px;
  object-fit:contain;
}
.sponsor-hint{
  font-size:13px;color:var(--text3);margin-bottom:16px;
}
.sponsor-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.sponsor-btn{
  padding:10px 20px;border:none;border-radius:100px;cursor:pointer;
  font-size:13px;font-weight:600;font-family:inherit;transition:all .2s;
}
.sponsor-btn-primary{
  background:linear-gradient(135deg,var(--accent),#ff8a5c);color:#fff;
}
.sponsor-btn-secondary{
  background:rgba(255,255,255,.06);color:var(--text3);
  border:1px solid rgba(255,255,255,.1);
}
.sponsor-btn:hover{transform:translateY(-1px)}

/* ===== RESPONSIVE ===== */
@media(max-width:480px){
  .quiz-page{padding:16px;padding-top:40px;padding-bottom:60px}
  .result-page{padding:16px;padding-top:40px;padding-bottom:60px}
  .progress-num{font-size:13px}
  .progress-bar{height:6px}
  .quiz-counter{font-size:12px}
  .question-card{padding:24px 18px;}
  .question-text{font-size:17px;margin-bottom:24px}
  .options{gap:10px}
  .option{padding:14px 16px;font-size:15px}
  .option-key{width:28px;height:28px;font-size:13px}
  .result-body{padding:24px}
  .start-features{gap:12px}
  .feature{min-width:100px;padding:14px 16px}
  .result-stats{grid-template-columns:repeat(3,1fr);gap:8px}
  .stat-item{padding:14px 6px}
  .stat-value{font-size:20px}
  .stat-label{font-size:11px}
}
/* ===== REDUCED MOTION ===== */
@media(prefers-reduced-motion:reduce){
  *{animation-duration:0.01ms!important;transition-duration:0.01ms!important}
}
</style>
</head>
<body>

<!-- Loading -->
<div class="loading-screen" id="loadingScreen">
  <div class="loading-orb"></div>
  <div class="loading-text">正在连接你的灵魂...</div>
</div>

<!-- Particles -->
<div class="particles" id="particles"></div>

<!-- Start Page -->
<div class="page active" id="startPage">
  <div class="start-badge">v2.0 灵魂级精度</div>
  <h1 class="start-title">灵魂鉴定局</h1>
  <p class="start-sub">通过30道灵魂拷问，精准识别你隐藏的真实人格。<br>科学依据：几乎没有，但准得离谱。</p>
  <div class="start-features">
    <div class="feature"><span class="feature-num">30</span><div class="feature-label">灵魂拷问</div></div>
    <div class="feature"><span class="feature-num">22</span><div class="feature-label">奇葩人格</div></div>
    <div class="feature"><span class="feature-num">4</span><div class="feature-label">人格大类</div></div>
  </div>
  <div class="start-categories">
    <div class="cat-card cat-blue"><span class="cat-dot" style="background:#3B82F6"></span><span class="cat-name">理性分析派</span><span class="cat-count">5种</span></div>
    <div class="cat-card cat-green"><span class="cat-dot" style="background:#10B981"></span><span class="cat-name">社交能量派</span><span class="cat-count">5种</span></div>
    <div class="cat-card cat-amber"><span class="cat-dot" style="background:#F59E0B"></span><span class="cat-name">自由享乐派</span><span class="cat-count">6种</span></div>
    <div class="cat-card cat-purple"><span class="cat-dot" style="background:#8B5CF6"></span><span class="cat-name">内敛独处派</span><span class="cat-count">5种</span></div>
  </div>
  <button class="btn-start" onclick="startQuiz()">开始鉴定灵魂</button>
</div>

<!-- Quiz Page -->
<div class="page" id="quizPage">
  <div class="quiz-header">
    <div class="progress-wrap">
      <span class="progress-num" id="progressNum">1/50</span>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div class="quiz-counter" id="quizCounter"></div>
  </div>
  <div class="question-card" id="questionCard">
    <div class="question-text" id="questionText"></div>
    <div class="options" id="optionsWrap"></div>
  </div>
</div>

<!-- Analyzing Page -->
<div class="page" id="analyzingPage">
  <div class="analyzing-spinner">
    <div class="analyzing-ring"></div>
    <div class="analyzing-ring"></div>
    <div class="analyzing-ring"></div>
    <div class="analyzing-face" id="analyzeFace">&#129300;</div>
  </div>
  <div class="analyzing-text" id="analyzeText">正在解析你的灵魂碎片...</div>
  <div class="analyzing-sub" id="analyzeSub">请勿关闭页面，你的灵魂正在排队</div>
</div>

<!-- Result Page -->
<div class="page" id="resultPage">
  <div class="result-card" id="resultCard"></div>
</div>

<!-- Sponsor Modal -->
<div class="sponsor-overlay hidden" id="sponsorModal">
  <div class="sponsor-modal">
    <button class="sponsor-close" onclick="closeSponsor()">&times;</button>
    <span class="sponsor-icon">&#9749;</span>
    <h3 class="sponsor-title">请作者喝杯咖啡</h3>
    <p class="sponsor-desc">
      灵魂鉴定局完全免费开放<br>
      如果测试结果让你笑了，可以请作者喝杯咖啡续命 ☕<br>
      您的赞助是我们持续更新的最大动力！
    </p>
    <div class="sponsor-qr-wrap">
      <img src="assets/images/qr-code.jpg" alt="赞助二维码" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
      <div style="display:none;width:200px;height:200px;background:linear-gradient(135deg,#1a1a2e,#16213e);border-radius:8px;color:#666;font-size:14px;align-items:center;justify-content:center;">二维码加载失败</div>
    </div>
    <p class="sponsor-hint">微信 / 支付宝 扫码即可赞助</p>
    <div class="sponsor-actions">
      <button class="sponsor-btn sponsor-btn-primary" onclick="closeSponsor()">朕已阅，下次再说</button>
      <button class="sponsor-btn sponsor-btn-secondary" onclick="neverShowSponsor()">不再提醒</button>
    </div>
  </div>
</div>

<script>
// ===== PARTICLES =====
(function(){
  const c=document.getElementById('particles');
  const colors=['#e94560','#feca57','#ff6b6b','#48dbfb','#ff9ff3','#54a0ff'];
  for(let i=0;i<20;i++){
    const p=document.createElement('div');
    p.className='particle';
    const s=Math.random()*6+3;
    p.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;background:${colors[i%colors.length]};animation-duration:${Math.random()*15+10}s;animation-delay:${Math.random()*10}s;`;
    c.appendChild(p);
  }
})();

// ===== DATA: 22 PERSONALITY TYPES =====
const personalities = [
  {
    id:'caffeine',name:'咖啡因驱动体',subtitle:'没有咖啡 = 没有生命',
    color:'#8B4513',emoji:'&#9749;',
    image:'assets/images/personality-caffeine.png',
    fallbackGradient:'linear-gradient(135deg,#8B4513,#D2691E)',
    description:'你的人生哲学很简单：咖啡续命，奶茶养魂。你的血管里流淌的不是血液，是美式。你的一天从第一杯咖啡开始，如果有人在你喝完咖啡前跟你说话，那是他们的错。你的工位永远有至少三个杯子，你的积分永远优先换咖啡券。科学研究表明，你可能在咖啡发明之前就已经在喝咖啡了。',
    tags:['早起靠咖啡','外卖常客','打工人之魂','杯子收藏家'],
    stats:{energy:95,social:60,chaos:40},
    compat:['奶茶鉴赏家','深夜修仙派','社交牛人'],
    compatScores:[95,70,55],
    advice:'偶尔尝试用水代替咖啡，你会发现自己其实是需要睡觉的，而不是需要咖啡因。'
  },
  {
    id:'snack',name:'零食囤积症患者',subtitle:'冰箱是我的安全区',
    color:'#FF6B35',emoji:'&#127846;',

  drama:'assets/images/Minimalist_flat_vector_illustr_2026-04-30T05-52-20.png',
  hero:'assets/images/Minimalist_flat_vector_illustr_2026-04-30T05-52-22.png',
  boba:'assets/images/Minimalist_flat_vector_illustr_2026-04-30T05-53-02.png',
  creative:'assets/images/Minimalist_flat_vector_illustr_2026-04-30T05-53-11.png',
  caffeine:'assets/images/Minimalist_flat_vector_illustr_2026-04-30T05-53-06.png',
  chef:'assets/images/Minimalist_flat_vector_illustr_2026-04-30T05-53-54.png',
  introvert:'assets/images/Minimalist_flat_vector_illustr_2026-04-30T05-54-44.png',
  couch:'assets/images/Minimalist_flat_vector_illustr_2026-04-30T05-55-27.png',
};
// CSS fallback art for personalities without generated images
const personalityFallback = {
  snack:{emoji:'&#127846;',bg:'linear-gradient(135deg,#F59E0B,#D97706)'},
  delivery:{emoji:'&#128230;',bg:'linear-gradient(135deg,#F97316,#EA580C)'},
  pet:{emoji:'&#128049;',bg:'linear-gradient(135deg,#FBBF24,#D97706)'},
  phone:{emoji:'&#128241;',bg:'linear-gradient(135deg,#FCD34D,#F59E0B)'},
  sleep:{emoji:'&#127769;',bg:'linear-gradient(135deg,#8B5CF6,#7C3AED)'},
  procrastinator:{emoji:'&#9200;',bg:'linear-gradient(135deg,#A78BFA,#8B5CF6)'},
  queen:{emoji:'&#128081;',bg:'linear-gradient(135deg,#C4B5FD,#A78BFA)'},
  samepicker:{emoji:'&#129318;',bg:'linear-gradient(135deg,#FF1744,#FF5252)'},
};

// ===== APP STATE =====
let currentQ = 0;
let scores = {};
let choiceHistory = []; // track which option (0-3) was picked each question

// ===== FUNCTIONS =====
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function startQuiz() {
  currentQ = 0;
  scores = {};
  choiceHistory = [];
  showPage('quizPage');
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentQ];
  const total = questions.length;
  document.getElementById('progressNum').textContent = `${currentQ + 1}/${total}`;
  document.getElementById('progressFill').style.width = `${((currentQ + 1) / total) * 100}%`;
  document.getElementById('quizCounter').textContent = `还剩 ${total - currentQ - 1} 道灵魂拷问`;
  document.getElementById('questionText').textContent = `${currentQ + 1}. ${q.q}`;
  
  const wrap = document.getElementById('optionsWrap');
  wrap.innerHTML = '';
  const keys = ['A','B','C','D'];
  q.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.innerHTML = `<span class="option-key">${keys[i]}</span><span>${opt.text}</span>`;
    btn.onclick = () => selectOption(opt.scores, i);
    wrap.appendChild(btn);
  });

  // Animate card
  const card = document.getElementById('questionCard');
  card.style.animation = 'none';
  card.offsetHeight; // trigger reflow
  card.style.animation = 'fadeSlideIn .5s ease';
}

function selectOption(optScores, optIndex) {
  for (const [id, val] of Object.entries(optScores)) {
    if (!scores[id]) scores[id] = 0;
    scores[id] += val;
  }
  choiceHistory.push(optIndex);
  currentQ++;
  if (currentQ < questions.length) {
    renderQuestion();
  } else {
    showAnalyzing();
  }
}

function showAnalyzing() {
  showPage('analyzingPage');
  const faces = ['&#129300;','&#128526;','&#128564;','&#129323;','&#128520;','&#129313;'];
  const texts = [
    '正在解析你的灵魂碎片...',
    '对照22种人格数据库...',
    '量子纠缠分析中...',
    '计算你的人格曲率...',
    '灵魂拼图中...',
    '最终鉴定中...'
  ];
  let step = 0;
  const faceEl = document.getElementById('analyzeFace');
  const textEl = document.getElementById('analyzeText');
  const subEl = document.getElementById('analyzeSub');
  
  const subs = [
    '请勿关闭页面',
    '你的灵魂正在排队',
    '已排到第3位',
    '马上就好...',
    '最后一步了！',
    '鉴定结果即将揭晓！'
  ];
  
  const timer = setInterval(() => {
    step++;
    if (step < faces.length) {
      faceEl.innerHTML = faces[step];
      textEl.textContent = texts[step];
      subEl.textContent = subs[step];
    }
    if (step >= faces.length + 1) {
      clearInterval(timer);
      showResult();
    }
  }, 600);
}

function getResult() {
  // Check if user picked the same option for ALL questions
  if (choiceHistory.length === questions.length) {
    const firstChoice = choiceHistory[0];
    const allSame = choiceHistory.every(c => c === firstChoice);
    if (allSame) {
      return personalities.find(p => p.id === 'samepicker');
    }
  }

  let maxScore = -Infinity;
  let result = personalities[0];
  for (const p of personalities) {
    const s = scores[p.id] || 0;
    if (s > maxScore) {
      maxScore = s;
      result = p;
    }
  }
  return result;
}

function showResult() {
  const result = getResult();
  const card = document.getElementById('resultCard');
  const catKey = personalityCategory[result.id];
  const cat = categories[catKey];
  const catColor = cat.color;
  const imgSrc = personalityImages[result.id];
  const fallback = personalityFallback[result.id];
  const hasImage = !!imgSrc;
  
  // Build image section
  let imageHTML;
  if (hasImage) {
    imageHTML = `<div class="result-image-wrap"><img src="${imgSrc}" alt="${result.name}"></div>`;
  } else {
    const fb = fallback || {emoji:'&#10024;',bg:`linear-gradient(135deg,${catColor},${catColor}88)`};
    imageHTML = `<div class="result-image-wrap"><div class="placeholder-art" style="background:${fb.bg};display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;"><span style="font-size:100px;line-height:1;">${fb.emoji}</span></div></div>`;
  }
  
  card.innerHTML = `
    ${imageHTML}
    <div class="result-body">
      <div class="result-cat-badge" style="background:${catColor}20;color:${catColor};border:1px solid ${catColor}40;">${cat.icon} ${cat.name}</div>
      <h2 class="result-title" style="color:${catColor};">${result.name}</h2>
      <p class="result-subtitle" style="color:${catColor}99;">${result.subtitle}</p>
      <p class="result-desc">${result.description}</p>
      
      <div class="result-tags">
        ${result.tags.map(t => `<span class="result-tag" style="border-color:${catColor}20;color:${catColor}cc;">${t}</span>`).join('')}
      </div>
      
      <div class="result-stats">
        <div class="stat-item">
          <div class="stat-value" style="color:${catColor};">${result.stats.energy}%</div>
          <div class="stat-label">能量值</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" style="color:${catColor};">${result.stats.social}%</div>
          <div class="stat-label">社交力</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" style="color:${catColor};">${result.stats.chaos}%</div>
          <div class="stat-label">混乱度</div>
        </div>
      </div>
      
      <div class="result-compat">
        <h4 style="color:${catColor};">最佳拍档匹配度</h4>
        <div class="result-compat-list">
          ${result.compat.map((name, i) => {
            const score = result.compatScores[i];
            const color = score > 80 ? '#10B981' : score > 60 ? '#F59E0B' : '#EF4444';
            return `<div class="compat-item">
              <span>${name}</span>
              <div class="compat-bar"><div class="compat-fill" style="width:${score}%;background:${color};" data-width="${score}"></div></div>
              <span class="compat-pct" style="color:${color}">${score}%</span>
            </div>`;
          }).join('')}
        </div>
      </div>
      
      <div class="result-advice" style="background:${catColor}08;border:1px solid ${catColor}20;">
        <h4 style="color:${catColor};">灵魂导师的建议</h4>
        <p>${result.advice}</p>
      </div>
      
      <button class="btn-share" style="background:${catColor};" onclick="shareResult()">分享我的灵魂鉴定结果</button>
      <button class="btn-retry" onclick="retryQuiz()">重新鉴定灵魂</button>
    </div>
  `;
  
  showPage('resultPage');
  
  // Animate compat bars
  setTimeout(() => {
    document.querySelectorAll('.compat-fill').forEach(bar => {
      const w = bar.dataset.width;
      bar.style.width = '0%';
      setTimeout(() => { bar.style.width = w + '%'; }, 100);
    });
  }, 300);

  // Show sponsor popup after results
  showSponsor();
}

// ===== SPONSOR MODAL =====
function showSponsor() {
  if (localStorage.getItem('sponsor_never_show') === 'true') return;
  // Delay 2s after result shown for better UX
  setTimeout(() => {
    const modal = document.getElementById('sponsorModal');
    if (modal) modal.classList.remove('hidden');
  }, 2000);
}

function closeSponsor() {
  const modal = document.getElementById('sponsorModal');
  if (modal) modal.classList.add('hidden');
}

function neverShowSponsor() {
  localStorage.setItem('sponsor_never_show', 'true');
  closeSponsor();
}

// ===== SHARE =====
function shareResult() {
  const result = getResult();
  const text = `我在【灵魂鉴定局】测出了自己的人格类型：${result.name}！${result.subtitle}\n\n快来测测你的灵魂属于哪一种奇葩人格吧！`;
  if (navigator.share) {
    navigator.share({title:'灵魂鉴定局',text}).catch(()=>{});
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.querySelector('.btn-share');
      btn.textContent = '已复制到剪贴板！';
      setTimeout(() => { btn.textContent = '分享我的灵魂鉴定结果'; }, 2000);
    });
  }
}

function retryQuiz() {
  showPage('startPage');
}

// ===== KEYBOARD SHORTCUTS =====
document.addEventListener('keydown', e => {
  if (!document.getElementById('quizPage').classList.contains('active')) return;
  const keyMap = {a:0,b:1,c:2,d:3,'1':0,'2':1,'3':2,'4':3};
  const idx = keyMap[e.key.toLowerCase()];
  if (idx !== undefined) {
    const opts = document.querySelectorAll('.option');
    if (opts[idx]) opts[idx].click();
  }
});

// ===== INIT =====
window.addEventListener('load', () => {
  setTimeout(() => {
    document.getElementById('loadingScreen').classList.add('hidden');
  }, 1500);
});
</script>
</body>
</html>
